  gest(G){for(const h of G.w){if(h.y<G.hipY)trk.armed=1;if(trk.armed&&bw.mode==='ready'&&h.y>G.hipY&&h.vy>1.8&&h.s>2.2){trk.armed=0;throwBall(clamp((h.s-2.2)/5,0,1),clamp((h.x-G.hipX)*2.2,-1,1),clamp(h.vx*.05,-.5,.5));break}}},
  step:bowlStep,cam(){const b=bw.ball,r=bw.mode==='roll';cam.position.lerp(tv.set(r?b.x*.5:0,1.7,3.6+(r?b.z*.22:0)),.06);cam.lookAt(0,.35,-14)}},
 soc:{name:'Penalties',sub:'Kick with your leg',world:'stadium',k:4,help:'Swing your leg up and across like a kick. A faster foot means a harder shot.',aiDelay:1.2,reset(){sc.k=0;sc.g=0;socReady()},can:()=>ok()&&sc.mode==='ready',aiAct(){kick(rnd(.4,1),rnd(-.8,.8)*(1.2-AIK*.5),rnd(.2,.9))},
  gest(G){for(const f of G.a){if(f.s>3&&f.vy>.5){kick(clamp((f.s-3)/6,0,1),clamp(f.vx/f.s*1.1,-1,1),.35+.65*clamp(f.vy/f.s,0,1));break}}},
  step:socStep,cam(){cam.position.lerp(tv.set(sc.mode==='ready'?0:sc.p.x*.3,1.9,3.8),.06);cam.lookAt(sc.p.x*.3,1.1,-11)}},
 bask:{name:'Basketball',sub:'Shoot over your head',world:'gym',k:1.5,help:'Flick one hand up above your shoulder to shoot. A medium flick drops it in.',aiDelay:1.3,reset(){bk.k=0;bk.pts=0;bkReady()},can:()=>ok()&&bk.mode==='ready',aiAct(){shoot(.55+rnd(-.35,.35)*(1.3-AIK),rnd(-.5,.5)*(1.3-AIK))},
  gest(G){for(const h of G.w){if(h.y>G.shY&&h.vy>2&&h.s>2.2){shoot(clamp((h.s-2.2)/4,0,1),clamp((h.x-G.hipX)*2,-1,1));break}}},
  step:bkStep,cam(){cam.position.lerp(tv.set(0,1.9,3.2),.06);cam.lookAt(0,2.2,-6)}},
 box:{name:'Boxing',sub:'Throw punches',world:'gym',k:.03,help:'Throw fast punches at the robot for 20 seconds. Bigger, faster punches score more.',aiDelay:.3,reset(){bx.run=0;bx.t=20;bx.s=0;bx.hit=0;bx.done=0;robotAt(0,-2.2,0);play('Idle');bxHud()},can:()=>ok()&&!bx.done,aiAct(){punch(rnd(.1,.9)*AIK)},
  gest(G){G.w.forEach((h,i)=>{if(h.s3>3.5&&G.now>bx.hc[i]){bx.hc[i]=G.now+250;punch(clamp((h.s3-3.5)/6,0,1))}})},
  step:bxStep,cam(){cam.position.lerp(tv.set(0,1.6,1.6),.06);cam.lookAt(0,1.3,-2.2)}},
 sprint:{name:'50 m Dash',sub:'Run on the spot',world:'stadium',k:.5,help:'Run on the spot with high knees. Faster steps, faster robot.',aiDelay:.28,reset(){sp5.run=0;sp5.t=10;sp5.d=0;sp5.cad=0;sp5.last=0;sp5.done=0;sBall.visible=false;robotAt(10.5,5,Math.PI);play('Idle');spHud()},can:()=>ok()&&!sp5.done,aiAct(){stride()},
  gest(G){const d=G.a[0].y-G.a[1].y;if(Math.abs(d)>.12&&Math.sign(d)!==sp5.sg){sp5.sg=Math.sign(d);stride()}},
  step:spStep,cam(){cam.position.lerp(tv.set(13.5,1.9,robot.position.z+5),.06);cam.lookAt(10.5,1,robot.position.z-4)}}
};
SP.sprint.world='stadium';

/* ---------- MAIN LOOP ---------- */
const cur=$('cur');let cx=0,cy=0,dw={el:null,t:0};
function cursor(dt){const bs=[...document.querySelectorAll('.btn')];if(!bs.length||!trk.lm){cur.style.display='none';return}
 cur.style.display='block';cx+=(trk.cx-cx)*Math.min(1,dt*10);cy+=(trk.cy-cy)*Math.min(1,dt*10);cur.style.left=cx+'px';cur.style.top=cy+'px';
 const el=bs.find(b=>{const r=b.getBoundingClientRect();return cx>r.left&&cx<r.right&&cy>r.top&&cy<r.bottom});
 if(el!==dw.el){dw={el,t:0}}else if(el){dw.t+=dt;if(dw.t>=1.1){const a=el.dataset.a;dw={el:null,t:-.6};act(a)}}
 cur.style.setProperty('--p',(el&&dw.t>0?clamp(dw.t/1.1,0,1)*360:0)+'deg')}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;S.t+=dt;S.hold-=dt;if(mix)mix.update(dt);fxStep(dt);
 const hub=['intro','menu','shop','scores'].includes(S.mode);
 if(hub){const a=S.t*(S.mode==='intro'?.28:.08),h=S.mode==='intro'?5+Math.min(S.t,9)*1.2:9;cam.position.set(Math.cos(a)*26,h,-8+Math.sin(a)*26);cam.lookAt(0,2,-8);
  if(S.mode==='intro'){if(Math.random()<dt*1.6)burst(rnd(-18,18),rnd(10,20),rnd(-30,-5),[0xffd23f,0xff3b8d,0x25d0ff,0x7dff6b][Math.random()*4|0],90);if(skip||S.t>10){skip=0;menu()}}}
 else if(S.sport){const sp=SP[S.sport];if(S.mode==='game'||S.mode==='between'||S.mode==='result')sp.step(dt);sp.cam()}
 if(S.mode==='game'&&S.pl[S.turn].ai&&SP[S.sport].can()){aiT-=dt;if(aiT<=0){SP[S.sport].aiAct();aiT=SP[S.sport].aiDelay*rnd(.7,1.3)}}
 cursor(dt);updAvatar(dt);comp.render()}
window.S=S;
setWorld('stadium');robotAt(0,-4,0);play('Dance');
show(`<h1>Sunday League</h1><p>Welcome to the Corner Shop Cup. Raise a hand above your head to skip this bit.</p>`,1);
startCam();requestAnimationFrame(loop);
</script></body></html>
