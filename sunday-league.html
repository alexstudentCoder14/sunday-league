 const scs={};keys.forEach(k=>{const s=new THREE.Scene();s.background=new THREE.Color(0x263042);s.add(new THREE.HemisphereLight(0xffffff,0x445566,1.6));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(3,6,5);s.add(d);const m=SC[k].clone(true);s.add(m);const D=dat[k],big=Math.max(D.sz.x,D.sz.y,D.sz.z);s.add(new THREE.GridHelper(Math.max(4,Math.ceil(Math.max(D.sz.x,D.sz.z)*1.4)),10,0x888888,0x444444));s.add(new THREE.AxesHelper(Math.max(1,big*.6)));scs[k]={s,sz:D.sz,c:D.c}});
 info.textContent='Tap Table for the numbers, Page 1-6 for pictures. In each picture: left view looks from +Z (BLUE axis points at you), right view is from above (blue points down the screen). Red = +X, green = up.';
 const cm=new THREE.PerspectiveCamera(40,1,.05,2000);R.setScissorTest(true);R.setClearColor(0x14181f);
 const tick=()=>{requestAnimationFrame(tick);const W0=innerWidth,H0=innerHeight,top=18,bot=40,tw=W0/cols,th=(H0-top-bot)/rows;R.setViewport(0,0,W0,H0);R.setScissor(0,0,W0,H0);R.clear();lab.innerHTML='';if(pg<0)return;
  keys.slice(pg*per,pg*per+per).forEach((k,i)=>{const x=(i%cols)*tw,y=top+((i/cols)|0)*th,o=scs[k],r=Math.max(o.sz.x,o.sz.y,o.sz.z)*1.15+.5,vh=th-18,vw=tw/2-2,gy=H0-(y+vh);
   for(let v=0;v<2;v++){const vx=x+v*tw/2;R.setViewport(vx,gy,vw,vh);R.setScissor(vx,gy,vw,vh);cm.aspect=vw/vh;cm.updateProjectionMatrix();
    if(v===0){cm.position.set(o.c.x,o.c.y+o.sz.y*.15,o.c.z+r*2.1);cm.up.set(0,1,0)}else{cm.position.set(o.c.x,o.c.y+r*2.4,o.c.z+.001);cm.up.set(0,0,-1)}cm.lookAt(o.c);R.render(o.s,cm)}
   lab.insertAdjacentHTML('beforeend',`<div style="position:fixed;left:${x+4}px;top:${y+vh+2}px;font:11px monospace;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none">${k} ${o.sz.x.toFixed(1)}x${o.sz.y.toFixed(1)}x${o.sz.z.toFixed(1)}m</div>`)})};tick()}

 startCam();buildStadium();requestAnimationFrame(loop)}
