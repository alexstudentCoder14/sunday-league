name: Embed models
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 embed-models.py sunday-league.html
      - run: mv sunday-league-embedded.html index.html
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "Embed models" || true
          git push
